# Publishes the showcase site to the gh-pages branch, which GitHub Pages serves
# at https://restack-ai.github.io/design-system/.
#
# The branch holds only the build output, so its history is deliberately thrown
# away and force-pushed on every deploy: it is an artefact, not a record.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run site:build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .nojekyll stops Pages from running the output through Jekyll, which
          # would drop any path beginning with an underscore.
          touch site-dist/.nojekyll
          cd site-dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
